<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Akuntansi Piutang Homestay</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Halaman login -->
  <div id="login-view" class="login">
    <div class="login-box">
      <h1>Akuntansi Piutang Homestay</h1>
      <p>Masuk dengan akun Supabase Anda.</p>
      <label>Email</label><input id="email" type="email">
      <label>Password</label><input id="password" type="password">
      <button onclick="login()">Masuk</button>
      <p id="login-error" class="err"></p>
    </div>
  </div>

  <!-- Aplikasi utama -->
  <div id="app-view" class="app" style="display:none">
    <aside class="sidebar">
      <div class="brand">Homestay<br>Accounting</div>
      <nav class="menu">
        <a data-p="dashboard" onclick="go('dashboard')">Dashboard</a>
        <span>Master Data</span>
        <a data-p="customers" onclick="go('customers')">Pelanggan</a>
        <a data-p="rooms" onclick="go('rooms')">Kamar</a>
        <a data-p="accounts" onclick="go('accounts')">Akun</a>
        <span>Transaksi</span>
        <a data-p="invoices" onclick="go('invoices')">Invoice (Piutang)</a>
        <a data-p="receipts" onclick="go('receipts')">Penerimaan Kas</a>
        <span>Laporan</span>
        <a data-p="receivables" onclick="go('receivables')">Laporan Piutang</a>
        <a data-p="aging" onclick="go('aging')">Aging Piutang</a>
        <a data-p="cashreport" onclick="go('cashreport')">Laporan Kas Masuk</a>
        <a data-p="journal" onclick="go('journal')">Jurnal Umum</a>
        <a data-p="ledger" onclick="go('ledger')">Buku Besar</a>
      </nav>
    </aside>
    <div class="main">
      <header class="navbar"><span id="user-email"></span><button class="ghost" onclick="logout()">Keluar</button></header>
      <main id="content"></main>
    </div>
  </div>

  <!-- Modal untuk form -->
  <div id="modal" class="modal"><div class="modal-box">
    <h3 id="modal-title"></h3><div id="modal-body"></div>
    <button class="ghost" onclick="closeModal()">Batal</button>
  </div></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config/supabase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/customers.js"></script>
  <script src="js/rooms.js"></script>
  <script src="js/invoices.js"></script>
  <script src="js/receipts.js"></script>
  <script src="js/journal.js"></script>
  <script src="js/ledger.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
